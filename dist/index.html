function seedSeries(seed,n,base,amp,shape){
 let s=(seed*9301+49297)%233280;const r=()=>{s=(s*9301+49297)%233280;return s/233280},out=[];
 for(let i=0;i<n;i++){
  const f=shape==="day"?(n>1?Math.sin(i/(n-1)*Math.PI)*.85+.15:1):shape==="week"?((i%7===5||i%7===6)?.6:1):1;

 }
 return out;
}

 });

  miniCard("小型冷風機迴風溫度分佈",bars([12,48,126,142,51,12].map(v=>Math.round(v*(selectedArea==="甲區"?1:.97))),["<20","20-22","22-24","24-26","26-28",">28"],"台",false),"小型冷風機×391 的迴風溫度 AI，並以運轉狀態 DI 篩選運轉中的機組","只統計運轉狀態 DI 為 ON 的機組；分箱寬度 2°C。右尾（>28°C）代表該區冷量不足或風機空轉，左尾代表過度供冷。"),
  miniCard("室內溫度達標率",miniLine(histSeries(51,86,12,{int:true,max:100}),L,"%"),"外氣預冷空調箱 PAH×98 及空調箱 AHU×24 的室內溫度 AI","達標率 = 室內溫度 AI 落在 23～26°C 的量測點數 ÷ 有效量測點數 × 100%；通訊異常與空值不列入分母。"),
  miniCard("空調箱設定溫度偏差",hbars([["PAH-B2-07",3.4],["AHU-5F-02",2.9],["PAH-3F-11",2.1],["AHU-7F-01",1.8],["PAH-1F-04",1.2],["PAH-9F-06",.7]]," °C",true),"PAH／AHU 的室內溫度 AI 與外氣溫度 AI","偏差 = |室內溫度 AI − 設定值|，取偏差最大的前 6 台。偏差長期偏大的機組優先排查閥件與風門。")
 ].join("");
 const air=[
  miniCard("濾網差壓到期排行",hbars([["PAH-B2-07",168],["AHU-5F-02",151],["PAH-3F-11",133],["PAH-1F-04",118],["AHU-7F-01",96],["PAH-9F-06",74],["PAH-6F-02",58],["AHU-2F-03",41]]," h",true),"PAH×98、AHU×24 的濾網差壓 DI","排行值 = 濾網差壓 DI 持續為 ON 的累積時數。前兩名以紅色標示，代表已達更換條件。"),
  miniCard("CO₂ 濃度熱區圖",heatmap(["1F 大廳","3F 辦公","5F 辦公","7F 會議"],m.key==="today"?hours:B,[[520,640,780,860,910,820,700],[480,700,880,960,1020,900,760],[460,660,840,920,980,870,720],[440,580,760,1080,1140,960,640]].map(r=>m.key==="today"?r:r.slice(0,B.length).concat(r.slice(0,Math.max(0,B.length-7)))),"ppm"),"PAH 的二氧化碳 AI×1／7 及 AHU 的二氧化碳 AI","每格為該分區該時段的 CO₂ 平均值。超過 1000 ppm（紅色）即需提高外氣量；7F 會議室尖峰集中在午後。"),
  miniCard("空氣側設備狀態與告警",stackedBars([
   {name:"運轉",values:[74,18,3]},{name:"停止",values:[21,5,1]},
   {name:"故障／跳脫",values:[2,1,0].map(v=>v*mult)},{name:"濾網差壓",values:[1,0,0].map(v=>v*mult)}
  ],["PAH 98","AHU 24","全熱 4"],"台"),"PAH×98、AHU×24、全熱交換機×4 的狀態 DI、故障／跳脫／警報 DI、濾網差壓 DI、偵煙器 DI","運轉與停止依狀態 DI 計數；故障與濾網為獨立 DI，同一台可能同時計入運轉與濾網警示。偵煙器 DI 觸發時另以消防系統處理，不列入此圖。"),
  miniCard("空氣品質偵測器",bars([620,540,580],["國際會議廳","防災中心","視訊會議室"],"ppm",false),"每區 3 台：溫度、濕度、CO、CO₂、PM2.5 各 1 點，另有數值×3（依中工分類表為 PM10、TVOC、甲醛 HCHO）","IO 表 0911 V2 已補上這 3 台的點位與 PM2.5，先前「0 台／預留點位」的敘述不再成立。分區空品指數可由各點的 CO₂ 與 PM2.5 判讀，不必再改用 PAH／AHU 的 CO₂。")
 ].join("");
 const parking=[
  miniCard("停車場 CO 濃度與風機連動",multiLine([{name:"CO 濃度",values:histSeries(61,9,16)},{name:"啟動風機台數",values:histSeries(62,12,26,{int:true})}],L,"ppm ／ 台"),"誘導風機×48 的一氧化碳 AI（樓層共用）、EAF×9／SAF×9／送排氣風機×117 的狀態 DI","兩序列共用同一軸以觀察連動：CO 上升後風機台數應隨即增加。若 CO 已升高但台數未動，代表連動控制或 CO 感測失效。"),
  miniCard("停車場風機群組運轉率",bars([88,92,79,84],["EAF 9","SAF 9","誘導 48","送排氣 117"],"%",false),"EAF×9、SAF×9、誘導風機×48、送排氣風機×117 的狀態 DI 與故障／跳脫 DI","群組運轉率 = 狀態 DI 為 ON 的台數 ÷ 該群組納管台數 × 100%；故障台數由分母排除，避免把故障機當成可調度容量。")
 ].join("");
 const sec=(title,desc,tag,cards,foot)=>'<section class="subsystem"><div class="subhead"><div><h2>'+esc(title)+'</h2><p>'+esc(desc)+'</p></div><span class="tag">'+esc(tag)+'</span></div><div class="grid chart-deck">'+cards+'</div>'+(foot?'<p class="footnote">'+esc(foot)+'</p>':"")+'</section>';
 return sec("主機水側運轉","冰水主機與泵浦、水塔的啟停台數、輪機時序與告警。","3 charts · "+m.note,plant)
  +sec("溫度與溫差分析","冰水與冷卻水的供回水溫、逼近溫度、冷量與末端迴風溫度。","6 charts · "+m.note,temp)
  +sec("空氣側、空品與維護","PAH／AHU 的濾網、CO₂ 與狀態告警。","4 charts · "+m.note,air)
  +sec("停車場通風","CO 濃度與送排風機的連動與可用率。","2 charts · "+m.note,parking,"空調全系統沒有可用的樓層欄位，所有圖表均為整棟或分區合計；歷史區間的數值為示意序列，串接 BMS 後以實際歷史資料替換。");
}
function elevatorConfig(){
 const m=rangeMeta(),avail=histSeries(81,88,10,{max:99.5}),running=histSeries(82,30,22,{int:true,max:61}),fault=histSeries(83,1,3,{int:true}),kw=histSeries(84,140,120,{int:true});
 const today=m.key==="today",last=a=>a[a.length-1],mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
 const pick=a=>Math.round((today?last(a):mean(a))*10)/10,rate=Math.round(today?last(avail):mean(avail));
 return{
  k:[[today?"電梯可用率":"平均可用率",pick(avail),"%","狀態／故障 DI"],[today?"運轉中":"平均運轉中",Math.round(today?last(running):mean(running)),"台","狀態 DI"],[today?"故障停機":"期間累計故障",today?last(fault):fault.reduce((x,y)=>x+y,0),today?"台":"件","故障 DI"],[today?"即時用電":"期間平均用電",Math.round(today?last(kw):mean(kw)),"kW","回電電表有效功率"]],
  chart:["電梯用電趨勢","kW",kw,"回電電表有效功率 kW、狀態 DI","每時用電 = Σ 電梯回電電表有效功率 kW",sparse(m.lineLabels,m.tick)],
  rate:rate,status:["可用","故障","通訊異常"],counts:[74,3,0]
 };
}
function sourceLinks(){
 return '<section class="card sources" aria-labelledby="source-title"><h2 id="source-title">資料來源</h2><div class="source-links"><a class="source-link" href="https://docs.google.com/spreadsheets/d/1uSfL-y2MgPgxlezYr6Kq_m7cm0j-b_AB/edit?usp=drive_link" target="_blank" rel="noopener noreferrer"><strong>智慧建築 IO 分類完整清單</strong><span>系統分類、設備類型與整理後點位的依據 ↗</span></a><a class="source-link" href="https://docs.google.com/spreadsheets/d/1FqHO-Op6UDNEEXhBSEegvap55jvbF0vK/edit?usp=drive_link" target="_blank" rel="noopener noreferrer"><strong>雲宇宙智慧監控系統 IO 表</strong><span>原始 IO 點位、設備數量及甲／乙區資料的依據 ↗</span></a></div></section>';
}
function overview(){
 document.title="智慧建築營運 Dashboard｜總覽";
 const cards=systems.map((s,i)=>{const c=s.id===3?hvacConfig():s.id===14?elevatorConfig():configs[i],alarm=c.counts[c.counts.length-1],qty=areaTotal(s.id);return '<article class="card sys" data-go="'+s.id+'" tabindex="0"><div class="sys-head"><h3>'+esc(s.name)+'</h3><span class="tag">'+esc(selectedArea)+'</span></div><div class="sys-rate">'+(hideRate(s.id)?"—":c.rate+"%")+'</div><div class="bar"><i style="width:'+(hideRate(s.id)?0:c.rate)+'%"></i></div><div class="sys-foot"><span>納管設備 '+qty.toLocaleString("zh-TW")+'</span><span>異常 '+alarm+'（示意）</span></div></article>'}).join("");
 app.innerHTML='<header class="top"><div><div class="eyebrow">OPERATIONS OVERVIEW</div><h1>智慧建築營運總覽</h1><p>用可使用的 DI 狀態與 AI 量測值，快速看運轉、異常與趨勢。</p></div>'+areaSwitch()+'</header><div class="notice"><b>資料說明</b><span>目前選擇 '+esc(selectedArea)+'。納管設備數依 IO 表；運轉、異常與用量為示意，正式串接 BMS 後替換成實際值。</span></div><section class="overview">'+cards+'</section>'+sourceLinks()+'<p class="footnote">點選任一系統卡進入分頁；每張圖旁均列出使用訊號與計算方式。</p>';
 bindAreaSwitch();
 app.querySelectorAll("[data-go]").forEach(el=>{const go=()=>location.hash="system-"+el.dataset.go;el.onclick=go;el.onkeydown=e=>{if(e.key==="Enter")go()}});
}
function systemPage(id){
 const s=systems[id-1];if(!s)return overview();const c=id===3?hvacConfig():id===14?elevatorConfig():configs[id-1];document.title="3DFM分析修正｜"+s.short+"可分析項目";
 const kpis=c.k.map(kpiCard).join(""),qty=areaTotal(id),both=areaData[areaKeys[id-1]],ratio=qty/Math.max(1,both["甲區"]+both["乙區"]),counts=c.counts.map(v=>Math.round(v*ratio*2)),total=counts.reduce((a,b)=>a+b,0),areaRate=total?Math.round(counts[0]/total*100):0,scopeNote=id===5?selectedArea+' IO 表納管設備 '+qty.toLocaleString("zh-TW")+' 台／組；另含集中式污廢水設備 68 台／組':selectedArea+' IO 表納管設備 '+qty.toLocaleString("zh-TW")+' 台／組';
 app.innerHTML='<header class="top"><div><div class="eyebrow">SYSTEM '+String(id).padStart(2,"0")+'</div><h1>'+esc(s.short)+'可分析項目</h1><p>依本系統可使用的 DI 與 AI，呈現實際可落地的營運指標。</p></div>'+areaSwitch(hasRange(id)?rangeSwitch():"")+'</header><section class="grid kpis">'+kpis+'</section><section class="grid work"><article class="card panel"><div class="panel-head"><h2>'+esc(c.chart[0])+'</h2><div>'+scopePill(chartScope(id))+' <span class="tag">'+esc(hasRange(id)?rangeMeta().note+" · 示意":"今日 · 示意")+'</span></div></div><div class="chart">'+lineChart(c.chart[2],c.chart[1],c.chart[5])+'</div></article><aside class="card panel basis"><div class="panel-head"><h2>計算依據</h2><span class="tag">DI / AI</span></div><dl><div><dt>使用的訊號</dt><dd>'+esc(c.chart[3])+'</dd></div><div><dt>簡單算法</dt><dd class="formula">'+esc(c.chart[4])+'</dd></div>'+(c.implNote?'<div><dt>實作差異</dt><dd class="impl">'+esc(c.implNote)+'</dd></div>':"")+'<div><dt>資料品質</dt><dd>排除通訊故障、空值及超出合理範圍的讀值；沒有歷史資料時不顯示趨勢。</dd></div></dl></aside></section><section class="grid lower"><article class="card panel"><div class="panel-head"><h2>即時狀態分布</h2>'+scopePill("整區合計")+'</div><div class="status-wrap'+(hideRate(id)?" no-ring":"")+'">'+(hideRate(id)?"":'<div class="ring" style="--rate:'+areaRate+'"><div><strong>'+areaRate+'%</strong><span>正常／可用率</span></div></div>')+'<div class="status-list">'+c.status.map((x,i)=>'<div class="status-row"><span>'+esc(x)+'</span><b class="'+(i===0?"ok":"bad")+'">'+counts[i]+'</b></div>').join("")+(hideRate(id)?"":'<div class="formula">正常率 = '+counts[0]+' ÷ '+Math.max(total,1)+' × 100%</div>')+'</div></div></article><article class="card panel"><div class="panel-head"><h2>可使用的原始訊號</h2><span class="tag">全案設備類型</span></div><div class="equipment">'+equipmentRows(s)+'</div></article></section>'+relatedEnergy(id)+(id===1?powerExtras()+powerAddons():"")+(id===3?hvacExtras():"")+(id===5?wastewaterExtras():"")+'<section class="system-meta"><div class="scopebar"><div><strong>'+esc(scopeNote)+'</strong><br><span>切換甲／乙區後，納管設備數與分區圖表會同步更新。</span></div>'+scopePill(chartScope(id))+'</div><div class="notice"><b>資料層級</b><span>只有照明、消防、水錶、排煙風機與插座具備可用的樓層欄位；其他圖表均標示為整棟或整區合計。</span></div></section><p class="footnote">納管設備數與樓層歸屬來自 IO 表。所有運轉、告警與用量數值均為介面示意，不代表目前現場狀況。</p>';
 if(id===12){app.querySelector(".work").remove()}
 if(id===16){app.querySelector(".work").remove();app.querySelector(".lower").remove();app.querySelector(".system-meta").insertAdjacentHTML("beforebegin",otherExtras())}
 bindAreaSwitch();bindRangeSwitch();
}
function render(){const m=location.hash.match(/system-(\d+)/);const id=m?Number(m[1]):0;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",Number(b.dataset.id)===id));id?systemPage(id):overview()}
window.addEventListener("hashchange",render);render();
</script>
