<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="依智慧建築 IO 表中的 DI 狀態與 AI 量測值設計之營運監控 Dashboard。">
  <title>智慧建築營運 Dashboard</title>
  <style>

    .brand{padding:0 10px 20px;border-bottom:1px solid #274456}.brand strong{display:block;color:white;font-size:1.18rem}.brand span{font-size:.83rem;color:#98b2c1}
    .nav{display:grid;gap:4px;margin-top:18px}.nav button{border:0;border-radius:9px;padding:9px 12px;text-align:left;background:transparent;color:#c5d7e2;cursor:pointer}.nav button:hover,.nav button.active{background:#15445d;color:#fff}.nav button.active{box-shadow:inset 3px 0 var(--cyan)}

nav.innerHTML='<button data-id="0">總覽 Overview</button>'+systems.map(s=>'<button data-id="'+s.id+'">'+esc(s.name)+'</button>').join("");
nav.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;location.hash=b.dataset.id==="0"?"overview":"system-"+b.dataset.id});
function lineChart(values,unit){
 const w=720,h=225,p={l:42,r:15,t:15,b:30},min=Math.min(...values)*.88,max=Math.max(...values)*1.08||1;
 const x=i=>p.l+i*(w-p.l-p.r)/(values.length-1),y=v=>p.t+(max-v)*(h-p.t-p.b)/(max-min||1);
 const points=values.map((v,i)=>x(i)+","+y(v)).join(" ");
 const area=points+" "+x(values.length-1)+","+(h-p.b)+" "+x(0)+","+(h-p.b);
 let grid="";for(let i=0;i<5;i++){const yy=p.t+i*(h-p.t-p.b)/4;const val=Math.round(max-i*(max-min)/4);grid+='<line class="gridline" x1="'+p.l+'" y1="'+yy+'" x2="'+(w-p.r)+'" y2="'+yy+'"/><text x="2" y="'+(yy+4)+'">'+val+'</text>'}
 const labels=hours.map((t,i)=>'<text text-anchor="middle" x="'+x(i)+'" y="'+(h-7)+'">'+t+'</text>').join("");
 return '<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="示意趨勢圖"><defs><linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#24c3d8" stop-opacity=".28"/><stop offset="1" stop-color="#24c3d8" stop-opacity=".02"/></linearGradient></defs>'+grid+'<polygon class="area" points="'+area+'"/><polyline class="series" points="'+points+'"/>'+values.map((v,i)=>'<circle class="dot" cx="'+x(i)+'" cy="'+y(v)+'" r="3"/>').join("")+labels+'<text x="'+(w-20)+'" y="12">'+esc(unit)+'</text></svg>';
}
function kpiCard(k,i){return '<article class="card kpi '+(["","green","amber","red"][i]||"")+'"><div class="kpi-label">'+esc(k[0])+'</div><div class="kpi-value">'+esc(k[1])+'<small>'+esc(k[2])+'</small></div><div class="kpi-note">依據：'+esc(k[3])+' · 示意</div></article>'}
function equipmentRows(s){
 if(!s.groups.length)return '<div class="empty">此系統目前沒有可用的 DI／AI。</div>';
 return s.groups.map(g=>'<div class="eq"><div class="eq-top"><strong>'+esc(g.group+(g.equipment&&g.equipment!=="—"?" · "+g.equipment:""))+'</strong><span class="qty">'+(g.quantity==null?"數量待確認":esc(g.quantity)+" 台／組")+'</span></div>'+(g.di.length?'<div class="signal"><b>DI：</b>'+esc(g.di.join("；"))+'</div>':"")+(g.ai.length?'<div class="signal"><b>AI：</b>'+esc(g.ai.join("；"))+'</div>':"")+'</div>').join("");
}
function overview(){
 document.title="智慧建築營運 Dashboard｜總覽";
 const cards=systems.map((s,i)=>{const c=configs[i],alarm=c.counts[2];return '<article class="card sys" data-go="'+s.id+'" tabindex="0"><div class="sys-head"><h3>'+esc(s.name)+'</h3><span class="tag">DI × AI</span></div><div class="sys-rate">'+c.rate+'%</div><div class="bar"><i style="width:'+c.rate+'%"></i></div><div class="sys-foot"><span>正常／可用率（示意）</span><span>異常 '+alarm+'</span></div></article>'}).join("");
 app.innerHTML='<header class="top"><div><div class="eyebrow">OPERATIONS OVERVIEW</div><h1>智慧建築營運總覽</h1><p>用可使用的 DI 狀態與 AI 量測值，快速看運轉、異常與趨勢。</p></div><span class="demo">示意資料｜待接 BMS</span></header><div class="notice"><b>資料說明</b><span>IO 表只定義可用訊號，沒有現場即時讀值與歷史紀錄。以下數字用來示範計算與版面，正式串接 BMS 後再替換成實際值。</span></div><section class="overview">'+cards+'</section><p class="footnote">點選任一系統卡進入分頁；每張圖旁均列出使用訊號與計算方式。</p>';
 app.querySelectorAll("[data-go]").forEach(el=>{const go=()=>location.hash="system-"+el.dataset.go;el.onclick=go;el.onkeydown=e=>{if(e.key==="Enter")go()}});
}
function systemPage(id){
 const s=systems[id-1],c=configs[id-1];if(!s)return overview();document.title="智慧建築營運 Dashboard｜"+s.short;
 const kpis=c.k.map(kpiCard).join(""), total=c.counts.reduce((a,b)=>a+b,0);
 app.innerHTML='<header class="top"><div><div class="eyebrow">SYSTEM '+String(id).padStart(2,"0")+'</div><h1>'+esc(s.short)+'營運 Dashboard</h1><p>依本系統可使用的 DI 與 AI，呈現實際可落地的營運指標。</p></div><span class="demo">示意資料｜待接 BMS</span></header><div class="notice"><b>不是點位數</b><span>卡片與圖表使用 DI 的 ON／OFF 狀態及 AI 的實際讀值進行計算；點位名稱僅用來說明資料來源。</span></div><section class="grid kpis">'+kpis+'</section><section class="grid work"><article class="card panel"><div class="panel-head"><h2>'+esc(c.chart[0])+'</h2><span class="tag">今日 · 示意</span></div><div class="chart">'+lineChart(c.chart[2],c.chart[1])+'</div></article><aside class="card panel basis"><div class="panel-head"><h2>計算依據</h2><span class="tag">DI / AI</span></div><dl><div><dt>使用的訊號</dt><dd>'+esc(c.chart[3])+'</dd></div><div><dt>簡單算法</dt><dd class="formula">'+esc(c.chart[4])+'</dd></div><div><dt>資料品質</dt><dd>排除通訊故障、空值及超出合理範圍的讀值；沒有歷史資料時不顯示趨勢。</dd></div></dl></aside></section><section class="grid lower"><article class="card panel"><div class="panel-head"><h2>即時狀態分布</h2><span class="tag">DI 狀態</span></div><div class="status-wrap"><div class="ring" style="--rate:'+c.rate+'"><div><strong>'+c.rate+'%</strong><span>正常／可用率</span></div></div><div class="status-list">'+c.status.map((x,i)=>'<div class="status-row"><span>'+esc(x)+'</span><b class="'+(i===0?"ok":"bad")+'">'+c.counts[i]+'</b></div>').join("")+'<div class="formula">正常率 = '+c.counts[0]+' ÷ '+total+' × 100%</div></div></div></article><article class="card panel"><div class="panel-head"><h2>可使用的原始訊號</h2><span class="tag">源自 IO 表</span></div><div class="equipment">'+equipmentRows(s)+'</div></article></section><p class="footnote">所有畫面值均為介面與算法示意，不代表目前現場狀況。正式值需由 BMS／設備通訊資料提供。</p>';
}
function render(){const m=location.hash.match(/system-(\d+)/);const id=m?Number(m[1]):0;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",Number(b.dataset.id)===id));id?systemPage(id):overview()}
window.addEventListener("hashchange",render);render();
</script>
</body>
</html>
