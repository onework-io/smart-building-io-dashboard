    .basis{background:#102f41;color:#dcebf3;border-color:#102f41}.basis h2{color:white}.basis .tag{background:#20485f;color:#d7edf7}.basis dl{margin:0;display:grid;gap:14px}.basis dt{font-size:.76rem;letter-spacing:.08em;color:#7fd6e6;font-weight:700}.basis dd{margin:3px 0 0;color:#e8f1f6;font-size:.9rem}.formula{padding:11px 12px;border-radius:9px;background:#173c51;color:white;font-weight:650}

function lineChart(values,unit){
 const w=720,h=225,p={l:42,r:15,t:15,b:30},min=Math.min(...values)*.88,max=Math.max(...values)*1.08||1;
 const x=i=>p.l+i*(w-p.l-p.r)/(values.length-1),y=v=>p.t+(max-v)*(h-p.t-p.b)/(max-min||1);
 const points=values.map((v,i)=>x(i)+","+y(v)).join(" ");
 const area=points+" "+x(values.length-1)+","+(h-p.b)+" "+x(0)+","+(h-p.b);
 let grid="";for(let i=0;i<5;i++){const yy=p.t+i*(h-p.t-p.b)/4;const val=Math.round(max-i*(max-min)/4);grid+='<line class="gridline" x1="'+p.l+'" y1="'+yy+'" x2="'+(w-p.r)+'" y2="'+yy+'"/><text x="2" y="'+(yy+4)+'">'+val+'</text>'}
 const labels=hours.map((t,i)=>'<text text-anchor="middle" x="'+x(i)+'" y="'+(h-7)+'">'+t+'</text>').join("");
 return '<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="示意趨勢圖"><defs><linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#24c3d8" stop-opacity=".28"/><stop offset="1" stop-color="#24c3d8" stop-opacity=".02"/></linearGradient></defs>'+grid+'<polygon class="area" points="'+area+'"/><polyline class="series" points="'+points+'"/>'+values.map((v,i)=>'<circle class="dot" cx="'+x(i)+'" cy="'+y(v)+'" r="3"/>').join("")+labels+'<text x="'+(w-20)+'" y="12">'+esc(unit)+'</text></svg>';
}

}

 app.innerHTML='<header class="top"><div><div class="eyebrow">OPERATIONS OVERVIEW</div><h1>智慧建築營運總覽</h1><p>用可使用的 DI 狀態與 AI 量測值，快速看運轉、異常與趨勢。</p></div><span class="demo">示意資料｜待接 BMS</span></header><div class="notice"><b>資料說明</b><span>IO 表只定義可用訊號，沒有現場即時讀值與歷史紀錄。以下數字用來示範計算與版面，正式串接 BMS 後再替換成實際值。</span></div><section class="overview">'+cards+'</section><p class="footnote">點選任一系統卡進入分頁；每張圖旁均列出使用訊號與計算方式。</p>';
 app.querySelectorAll("[data-go]").forEach(el=>{const go=()=>location.hash="system-"+el.dataset.go;el.onclick=go;el.onkeydown=e=>{if(e.key==="Enter")go()}});
