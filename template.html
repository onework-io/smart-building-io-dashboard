  miniCard("航空障礙燈",bars([0,1],["障礙燈-01","障礙燈-02"],"故障",true),"故障／跳脫 DI、通訊狀態（故障）DI","單台異常 = 任一故障／跳脫 DI 為 ON，或通訊狀態為故障。"),
  miniCard("電子看板",miniLine([169,170,168,171,170,169,170],hours,"台"),"通訊狀態（故障）DI","在線看板數 = 172 − 通訊故障數；在線率 = 在線看板數 ÷ 172 × 100%。")
 ].join("");
 return '<section class="subsystem"><div class="subhead"><div><h2>設備別獨立監控</h2><p>每一種設備各自一張圖，不跨設備混合計算。</p></div><span class="tag">12 devices · 12 charts</span></div><div class="grid chart-deck">'+charts+'</div></section>';
}
function overview(){
 document.title="智慧建築營運 Dashboard｜總覽";
 const cards=systems.map((s,i)=>{const c=configs[i],alarm=c.counts[2],qty=areaTotal(s.id);return '<article class="card sys" data-go="'+s.id+'" tabindex="0"><div class="sys-head"><h3>'+esc(s.name)+'</h3><span class="tag">'+esc(selectedArea)+'</span></div><div class="sys-rate">'+c.rate+'%</div><div class="bar"><i style="width:'+c.rate+'%"></i></div><div class="sys-foot"><span>納管設備 '+qty.toLocaleString("zh-TW")+'</span><span>異常 '+alarm+'（示意）</span></div></article>'}).join("");
 app.innerHTML='<header class="top"><div><div class="eyebrow">OPERATIONS OVERVIEW</div><h1>智慧建築營運總覽</h1><p>用可使用的 DI 狀態與 AI 量測值，快速看運轉、異常與趨勢。</p></div>'+areaSwitch()+'</header><div class="notice"><b>資料說明</b><span>目前選擇 '+esc(selectedArea)+'。納管設備數依 IO 表；運轉、異常與用量為示意，正式串接 BMS 後替換成實際值。</span></div><section class="overview">'+cards+'</section><p class="footnote">點選任一系統卡進入分頁；每張圖旁均列出使用訊號與計算方式。</p>';
 bindAreaSwitch();
 app.querySelectorAll("[data-go]").forEach(el=>{const go=()=>location.hash="system-"+el.dataset.go;el.onclick=go;el.onkeydown=e=>{if(e.key==="Enter")go()}});
}
function systemPage(id){
 const s=systems[id-1],c=configs[id-1];if(!s)return overview();document.title="智慧建築營運 Dashboard｜"+s.short;
 const kpis=c.k.map(kpiCard).join(""),qty=areaTotal(id),both=areaData[areaKeys[id-1]],ratio=qty/Math.max(1,both["甲區"]+both["乙區"]),counts=c.counts.map(v=>Math.round(v*ratio*2)),total=counts.reduce((a,b)=>a+b,0),areaRate=total?Math.round(counts[0]/total*100):0,scopeNote=id===5?selectedArea+' IO 表納管設備 '+qty.toLocaleString("zh-TW")+' 台／組；另含集中式污廢水設備 68 台／組':selectedArea+' IO 表納管設備 '+qty.toLocaleString("zh-TW")+' 台／組';
 app.innerHTML='<header class="top"><div><div class="eyebrow">SYSTEM '+String(id).padStart(2,"0")+'</div><h1>'+esc(s.short)+'營運 Dashboard</h1><p>依本系統可使用的 DI 與 AI，呈現實際可落地的營運指標。</p></div>'+areaSwitch()+'</header><div class="scopebar"><div><strong>'+esc(scopeNote)+'</strong><br><span>切換甲／乙區後，納管設備數與分區圖表會同步更新。</span></div>'+scopePill(chartScope(id))+'</div><div class="notice"><b>資料層級</b><span>只有照明、消防、水錶、排煙風機與插座具備可用的樓層欄位；其他圖表均標示為整棟或整區合計。</span></div><section class="grid kpis">'+kpis+'</section><section class="grid work"><article class="card panel"><div class="panel-head"><h2>'+esc(c.chart[0])+'</h2><div>'+scopePill(chartScope(id))+' <span class="tag">今日 · 示意</span></div></div><div class="chart">'+lineChart(c.chart[2],c.chart[1])+'</div></article><aside class="card panel basis"><div class="panel-head"><h2>計算依據</h2><span class="tag">DI / AI</span></div><dl><div><dt>使用的訊號</dt><dd>'+esc(c.chart[3])+'</dd></div><div><dt>簡單算法</dt><dd class="formula">'+esc(c.chart[4])+'</dd></div><div><dt>資料品質</dt><dd>排除通訊故障、空值及超出合理範圍的讀值；沒有歷史資料時不顯示趨勢。</dd></div></dl></aside></section><section class="grid lower"><article class="card panel"><div class="panel-head"><h2>即時狀態分布</h2>'+scopePill("整區合計")+'</div><div class="status-wrap"><div class="ring" style="--rate:'+areaRate+'"><div><strong>'+areaRate+'%</strong><span>正常／可用率</span></div></div><div class="status-list">'+c.status.map((x,i)=>'<div class="status-row"><span>'+esc(x)+'</span><b class="'+(i===0?"ok":"bad")+'">'+counts[i]+'</b></div>').join("")+'<div class="formula">正常率 = '+counts[0]+' ÷ '+Math.max(total,1)+' × 100%</div></div></div></article><article class="card panel"><div class="panel-head"><h2>可使用的原始訊號</h2><span class="tag">全案設備類型</span></div><div class="equipment">'+equipmentRows(s)+'</div></article></section>'+relatedEnergy(id)+(id===1?powerExtras():"")+(id===5?wastewaterExtras():"")+'<p class="footnote">納管設備數與樓層歸屬來自 IO 表。所有運轉、告警與用量數值均為介面示意，不代表目前現場狀況。</p>';
 if(id===16){app.querySelector(".work").remove();app.querySelector(".lower").remove();app.querySelector(".footnote").insertAdjacentHTML("beforebegin",otherExtras())}
 bindAreaSwitch();
}
function render(){const m=location.hash.match(/system-(\d+)/);const id=m?Number(m[1]):0;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",Number(b.dataset.id)===id));id?systemPage(id):overview()}
window.addEventListener("hashchange",render);render();
</script>
</body>
</html>
